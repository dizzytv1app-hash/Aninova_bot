# Litestream konfiguratsiyasi — anime.db'ni Filebase'ga zaxiralaydi
# (karta talab qilinmaydi, 5GB bepul, S3-mos).
# Access key/secret'ni shu faylga YOZMANG — environment variable orqali kelsin
# (LITESTREAM_ACCESS_KEY_ID va LITESTREAM_SECRET_ACCESS_KEY).

# Eski zaxira fayllar joy tutib qolmasligi uchun — 7 kundan eski nusxalar
# avtomatik o'chiriladi (global sozlama, barcha replikalarga tegishli).
snapshot:
  interval: 24h
  retention: 168h

dbs:
  - path: anime.db          # main.py bilan bir xil papkadagi baza fayli
    replicas:
      - type: s3
        bucket: hostinguchun1                 # sizning Filebase bucketingiz
        path: db
        endpoint: https://s3.filebase.io      # Filebase konsolida ko'rsatilgan joriy endpoint
        region: auto                           # Filebase konsolida ko'rsatilgan joriy qiymat
        force-path-style: true
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
